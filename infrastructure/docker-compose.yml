name: paylite-infrastructure

services:

  postgres:
    image: postgres:17.4
    container_name: paylite-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  consul:
    image: hashicorp/consul:1.21.3
    container_name: paylite-consul
    command: agent -dev -client=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8500:8500"
      - "8600:8600/udp"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.3
    container_name: paylite-keycloak
    command: start-dev --import-realm
    volumes:
      - ./realm-config:/opt/keycloak/data/import
      - ./realm-config/keycloak-health-check.sh:/opt/keycloak/health-check.sh
    environment:
      KC_DB: dev-file
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_FEATURES: scripts
      KC_HTTP_PORT: 9080
      KC_HTTPS_PORT: 9443
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: 9990
    ports:
      - "9080:9080"
      - "9443:9443"
    healthcheck:
      test: ["CMD-SHELL", "bash /opt/keycloak/health-check.sh"]
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 10s

volumes:
  postgres_data: