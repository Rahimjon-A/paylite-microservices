name: paylite-infrastructure

services:
  postgres:
    image: postgres:17.4
    container_name: paylite-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    ports:
      - '127.0.0.1:5433:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  consul:
    image: hashicorp/consul:1.21.3
    container_name: paylite-consul
    command: agent -dev -client=0.0.0.0
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:8500:8500'
      - '127.0.0.1:8600:8600/udp'

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.3
    container_name: paylite-keycloak
    command: start-dev --import-realm
    volumes:
      - ./realm-config:/opt/keycloak/data/import
      - ./realm-config/keycloak-health-check.sh:/opt/keycloak/health-check.sh
    environment:
      KC_DB: dev-file

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}

      KC_FEATURES: scripts
      KC_HTTP_PORT: 9080
      KC_HTTPS_PORT: 9443
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_MANAGEMENT_PORT: 9990

      PAYLITE_CLIENT_SECRET: ${PAYLITE_CLIENT_SECRET:?Set PAYLITE_CLIENT_SECRET}
      PAYLITE_FRONTEND_SECRET: ${PAYLITE_FRONTEND_SECRET:?Set PAYLITE_FRONTEND_SECRET}
      CARD_BANK_CLIENT_SECRET: ${CARD_BANK_CLIENT_SECRET:?Set CARD_BANK_CLIENT_SECRET}
      UZCARD_CLIENT_SECRET: ${UZCARD_CLIENT_SECRET:?Set UZCARD_CLIENT_SECRET}
      HUMO_CLIENT_SECRET: ${HUMO_CLIENT_SECRET:?Set HUMO_CLIENT_SECRET}
      AGENT_LOGIN: ${AGENT_LOGIN:?Set AGENT_LOGIN}
      AGENT2_LOGIN: ${AGENT2_LOGIN:?Set AGENT2_LOGIN}
      AGENT_PASSWORD: ${AGENT_PASSWORD:?Set AGENT_PASSWORD}
      AGENT2_PASSWORD: ${AGENT2_PASSWORD:?Set AGENT2_PASSWORD}

    ports:
      - '127.0.0.1:9080:9080'
      - '127.0.0.1:9443:9443'
    healthcheck:
      test: ['CMD-SHELL', 'bash /opt/keycloak/health-check.sh']
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 10s

volumes:
  postgres_data:
